[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-simulation-loop-aws"
version = "0.1.0"
description = "Stable contracts and reproducible scenarios for an AgentOps simulation loop on AWS"
readme = "README.md"
requires-python = ">=3.12,<4"
license = { file = "LICENSE" }
authors = [{ name = "Rustem Feyzkhanov" }]
dependencies = [
  "aiosqlite>=0.22,<1",
  "fastmcp>=3.4.7,<4",
  "langchain>=1.4,<2",
  "langchain-mcp-adapters>=0.3.2,<0.4",
  "langgraph>=1.2,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=1.7,<2"]
dsql = [
  "asyncpg>=0.31,<1",
  "aurora-dsql-python-connector>=0.2.7,<0.3",
]
aws = [
  "aws-opentelemetry-distro>=0.19,<0.20",
  "boto3>=1.43.89,<2",
  "fastapi>=0.141,<1",
  "openinference-instrumentation-langchain>=0.1.74,<0.2",
  "uvicorn>=0.52,<1",
]
web = [
  "ag-ui-langgraph[fastapi]>=0.0.43,<0.1",
  "fastapi>=0.141,<1",
  "uvicorn>=0.52,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.11,<1",
]
harbor = [
  "harbor[ec2]>=0.22,<0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_demo"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "aws_agentcore: opt-in test requiring a deployed AgentCore runtime",
  "aws_dsql: opt-in test requiring a deployed Aurora DSQL cluster",
  "aws_evaluation: opt-in test requiring deployed AgentCore evaluation resources",
  "aws_observability: opt-in test requiring CloudWatch Transaction Search",
  "real_model: opt-in test requiring Bedrock credentials and the bedrock extra",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
