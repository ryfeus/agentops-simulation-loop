[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed public Qwen tokenizer commit, not an API credential"
condition = "AND"
paths = ['''(^|/)rl/phase12/experiment\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer_revision": "c1899de289a04d12100db370d81485cdf75e47ca",?\s*$''']
