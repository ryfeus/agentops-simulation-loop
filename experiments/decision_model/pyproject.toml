[project]
name = "billing-decision-model-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "strands-decider",
  "matplotlib>=3.9,<4",
  "pytest>=8.3,<9",
  "agentops-simulation-loop-aws[aws,bedrock]",
  "harbor[ec2]>=0.22,<0.23",
]

[project.optional-dependencies]
gpu = [
    "flash-linear-attention>=0.5 ; sys_platform == 'linux'",
]

[tool.uv.sources]
strands-decider = { git = "https://github.com/strands-labs/strands-decider.git", rev = "6039cf8b64c6074e75804000c07ac3d4cce795f7" }
agentops-simulation-loop-aws = { path = "../../", editable = true }
