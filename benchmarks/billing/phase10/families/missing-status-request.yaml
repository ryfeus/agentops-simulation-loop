schema_version: '1'
id: missing-status-request
prototype: missing-status
archetype: missing-invoice
difficulty: paraphrase
variant_count: 5
instruction_templates:
- What is the status of invoice {target_invoice}?
- Please locate {target_invoice} and tell me its current status.
- I am checking a bill numbered {target_invoice}; what does your system show?
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - open
  - paid
  distractor_owner:
  - other
  - same
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - missing
negative_strategy: refund_wrong_target
