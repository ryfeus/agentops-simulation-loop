schema_version: '1'
id: normal-open-adjustment
prototype: open-refund-direct
archetype: normal-refund
difficulty: easy
variant_count: 5
instruction_templates:
- Please refund the open invoice {target_invoice}.
- The open bill {target_invoice} needs a refund, while {other_invoice} stays as it
  is.
- Apply the refund to open invoice {target_invoice} only.
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - paid
  - open
  distractor_owner:
  - same
  - other
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - open
negative_strategy: lookup_only
