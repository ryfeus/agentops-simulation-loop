schema_version: '1'
id: wrong-cross-customer
prototype: target-refund-not-other
archetype: wrong-target
difficulty: compound
variant_count: 5
instruction_templates:
- For customer {customer_id}, refund {target_invoice}; {other_invoice} is not the
  requested charge.
- Please identify the right account before refunding {target_invoice}; ignore {other_invoice}.
- The refund must go to {target_invoice} on my account, not the other invoice.
dimensions:
