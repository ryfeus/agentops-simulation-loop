schema_version: '1'
id: multi-paid-disputed-order
prototype: multi-paid-and-disputed
archetype: multi-invoice
difficulty: compound
variant_count: 5
instruction_templates:
- Refund {target_invoice} and arrange dispute handling for {other_invoice}.
- First check {other_invoice}, then refund {target_invoice} and handle that dispute.
- 'Two issues: the paid charge {target_invoice} and the disputed bill {other_invoice}.
  Resolve both.'
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - paid
  - open
  distractor_owner:
  - same
  - other
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - paid
negative_strategy: lookup_only
