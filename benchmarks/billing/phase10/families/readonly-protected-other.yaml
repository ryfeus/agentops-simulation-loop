schema_version: '1'
id: readonly-protected-other
prototype: status-paid-readonly
archetype: read-only
difficulty: compound
variant_count: 5
instruction_templates:
- Report the status of {target_invoice}; {other_invoice} is only another bill on the
  account.
- Please check both bills, starting with {target_invoice}, and make no changes.
- I need a status answer for {target_invoice}, not a correction to {other_invoice}.
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - paid
  - open
  distractor_owner:
  - other
  - same
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - paid
negative_strategy: refund_wrong_target
inspection_scope: both
