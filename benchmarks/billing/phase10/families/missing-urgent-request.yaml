schema_version: '1'
id: missing-urgent-request
prototype: missing-refund
archetype: missing-invoice
difficulty: adversarial
variant_count: 5
instruction_templates:
- 'This is urgent: refund the invoice numbered {target_invoice} if you can find it.'
- I need help right away with missing invoice {target_invoice}; please verify it first.
- Please act on refund request {target_invoice} only if that invoice is actually present.
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - paid
  - open
  distractor_owner:
  - other
  - same
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - missing
negative_strategy: refund_wrong_target
