schema_version: '1'
id: readonly-paid-status
prototype: status-paid-readonly
archetype: read-only
difficulty: easy
variant_count: 5
instruction_templates:
- What is the status of {target_invoice}?
- Tell me whether paid invoice {target_invoice} has changed status.
- Check {target_invoice} and report its current billing status.
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - paid
  - open
  distractor_owner:
  - same
  - other
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - paid
negative_strategy: refund_target
