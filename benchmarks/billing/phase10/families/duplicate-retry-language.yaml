schema_version: '1'
id: duplicate-retry-language
prototype: repeat-refund-request
archetype: duplicate-action
difficulty: paraphrase
variant_count: 5
instruction_templates:
- The last refund request for {target_invoice} may have timed out; check before retrying.
- If the action for {target_invoice} already succeeded, do not send it twice.
- Please resolve the possible retry on invoice {target_invoice}.
dimensions:
  target_amount:
  - '9.99'
  - '19.00'
  - '49.00'
  - '85.50'
  - '120.00'
  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - paid
  - open
  distractor_owner:
  - same
  - other
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - paid
negative_strategy: duplicate_refund
