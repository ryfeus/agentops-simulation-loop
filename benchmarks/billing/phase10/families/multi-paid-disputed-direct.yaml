  distractor_count:
  - '1'
  - '2'
  distractor_status:
  - open
  - paid
  distractor_owner:
  - other
  - same
  target_invoice_style:
  - numeric
  - similar_ids
  entity_order:
  - original
  - reverse
constraints:
  target_status:
  - paid
negative_strategy: lookup_only
