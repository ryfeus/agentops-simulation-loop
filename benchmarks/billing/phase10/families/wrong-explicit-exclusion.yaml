schema_version: '1'
id: wrong-explicit-exclusion
prototype: target-refund-not-other
archetype: wrong-target
difficulty: adversarial
variant_count: 5
instruction_templates:
- Do not refund {other_invoice}; my request applies to {target_invoice}.
- I am explicitly excluding {other_invoice}. Reverse {target_invoice} instead.
- The invoice to change is {target_invoice}, never {other_invoice}.
dimensions:
