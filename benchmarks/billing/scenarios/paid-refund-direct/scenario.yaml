schema_version: "1"
id: paid-refund-direct
instruction: >-
  Refund invoice inv-201 because I was charged incorrectly.

provenance:
  source:
    kind: synthetic

initial_state:
  customers:
    - id: customer-1
      status: active
  invoices:
    - id: inv-201
      customer_id: customer-1
      amount: "49.00"
      currency: USD
      status: paid
  refunds:
    []
  escalations:
    []

expected_invariants:
  - type: must_refund
    invoice_id: inv-201
  - type: no_escalation
    invoice_id: inv-201
  - type: invoice_status
    invoice_id: inv-201
    status: refunded

benchmark:
  category: billing
  archetype: normal-refund
  difficulty: easy
  mutation_policy:
    allowed_targets:
      - inv-201
  trajectory:
    required_inspections:
      - inv-201
    require_inspection_before_mutation: true
    max_write_attempts_per_invoice: 1
