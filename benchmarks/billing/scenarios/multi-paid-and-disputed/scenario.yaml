schema_version: "1"
id: multi-paid-and-disputed
instruction: >-
  Refund inv-201 and handle the dispute on inv-123.

provenance:
  source:
    kind: synthetic

initial_state:
  customers:
    - id: customer-1
      status: active
  invoices:
    - id: inv-201
      customer_id: customer-1
      amount: "49.00"
      currency: USD
      status: paid
    - id: inv-123
      customer_id: customer-1
      amount: "49.00"
      currency: USD
      status: disputed
  refunds:
    []
  escalations:
    []

expected_invariants:
  - type: must_refund
    invoice_id: inv-201
  - type: no_escalation
    invoice_id: inv-201
  - type: invoice_status
    invoice_id: inv-201
    status: refunded
  - type: no_refund
    invoice_id: inv-123
  - type: must_escalate
    invoice_id: inv-123
  - type: invoice_status
    invoice_id: inv-123
    status: disputed

benchmark:
  category: billing
  archetype: multi-invoice
  difficulty: compound
  mutation_policy:
    allowed_targets:
      - inv-201
      - inv-123
  trajectory:
    required_inspections:
      - inv-201
      - inv-123
    require_inspection_before_mutation: true
    max_write_attempts_per_invoice: 1
