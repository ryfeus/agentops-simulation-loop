schema_version: "1"
id: open-refund-direct
instruction: >-
  Please reverse invoice inv-202.

provenance:
  source:
    kind: synthetic

initial_state:
  customers:
    - id: customer-1
      status: active
  invoices:
    - id: inv-202
      customer_id: customer-1
      amount: "49.00"
      currency: USD
      status: open
  refunds:
    []
  escalations:
    []

expected_invariants:
  - type: must_refund
    invoice_id: inv-202
  - type: no_escalation
    invoice_id: inv-202
  - type: invoice_status
    invoice_id: inv-202
    status: refunded

benchmark:
  category: billing
  archetype: normal-refund
  difficulty: easy
  mutation_policy:
    allowed_targets:
      - inv-202
  trajectory:
    required_inspections:
      - inv-202
    require_inspection_before_mutation: true
    max_write_attempts_per_invoice: 1
