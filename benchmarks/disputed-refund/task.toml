schema_version = "1.4"
artifacts = ["/app/data/billing.db", "/app/data/agent-run.json"]

[task]
name = "agentops-demo/disputed-refund"
version = "0.1.0"
description = "Disputed duplicate-charge billing policy scenario"
keywords = ["billing", "policy", "mcp", "langgraph"]

[metadata]
scenario_id = "disputed-refund"
category = "billing"
failure_type = "policy_violation"
source_kind = "synthetic"

[agent]
timeout_sec = 120
network_mode = "no-network"
user = "root"

[verifier]
timeout_sec = 60
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600
